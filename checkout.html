
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | SHOPOHOLICS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="announcement">
        FREE DELIVERY ON ORDERS ABOVE RS. 5000
    </div>

    <header>
        <h1>SHOPOHOLICS.</h1>
        <p>Your Style, Your Choice</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#shop">Shop</a>
        <a href="index.html#wishlist">Wishlist</a>
        <a href="index.html#cart">Cart</a>
        <a href="admin.html">Admin</a>
    </nav>

    <section class="checkout-section">
        <h2>Complete Your Order</h2>

        <div class="order-summary">
            <h3>Your Order Total: Rs. <span id="checkout-total">0</span></h3>
            <p>Payment Method: Cash on Delivery</p>
        </div>

        <form id="checkout-form">

            <label for="customer-name">Full Name</label>
            <input type="text" id="customer-name"
                   placeholder="Enter your full name" required>

            <label for="customer-email">Email Address</label>
            <input type="email" id="customer-email"
                   placeholder="Enter your email" required>

            <label for="customer-phone">Phone Number</label>
            <input type="tel" id="customer-phone"
                   placeholder="Enter your phone number" required>

            <label for="customer-address">Delivery Address</label>
            <textarea id="customer-address"
                      placeholder="Enter complete delivery address"
                      required></textarea>

            <button type="submit">Place Order</button>

        </form>

        <p id="order-message"></p>

        <a href="index.html#shop" class="shop-btn">
            Continue Shopping
        </a>
    </section>

    <footer>
        <h2>SHOPOHOLICS.</h2>
        <p>Style • Quality • Happiness</p>
        <p>© 2026 SHOPOHOLICS. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
